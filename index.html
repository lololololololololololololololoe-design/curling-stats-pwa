<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Перенаправление на приложение керлинга</title>
    <meta http-equiv="refresh" content="0; url=/curling-stats-pwa/app-index.html">
    <link rel="manifest" href="/curling-stats-pwa/manifest.json">
    <link rel="icon" href="/curling-stats-pwa/icons/icon-192.png">
</head>
<body style="
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    color: white;
    text-align: center;
    padding: 20px;
">
    <div style="
        background: white;
        padding: 40px;
        border-radius: 20px;
        color: #2c3e50;
        max-width: 500px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    ">
        <h1 style="margin-bottom: 20px;">
            <i class="fas fa-hockey-puck"></i> Статистика Керлинга
        </h1>
        <p style="margin-bottom: 30px; font-size: 1.1rem;">
            Приложение загружается...
        </p>
        <div style="margin-top: 20px;">
            <a href="/curling-stats-pwa/app-index.html" 
               style="
                   background: #3498db;
                   color: white;
                   padding: 12px 24px;
                   border-radius: 8px;
                   text-decoration: none;
                   font-weight: 600;
                   display: inline-block;
               ">
                Перейти сейчас
            </a>
        </div>
        <p style="margin-top: 30px; font-size: 0.9rem; color: #7f8c8d;">
            Если перенаправление не сработало, нажмите кнопку выше
        </p>
    </div>
    
    <script>
        // Автоматический редирект через 1 секунду если не сработал meta refresh
        setTimeout(function() {
            window.location.href = '/curling-stats-pwa/app-index.html';
        }, 1000);
    </script>
    
    <!-- Подключаем Font Awesome для иконки -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</body>
</html>
