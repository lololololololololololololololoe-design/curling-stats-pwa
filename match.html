<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Матч - Статистика Керлинга</title>
    <meta name="theme-color" content="#2c3e50">
    <base href="/curling-stats-pwa/">
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    
    <!-- Стили -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Шапка матча -->
        <header class="header">
            <div class="header-left">
                <a href="/curling-stats-pwa/app-index.html" class="btn btn-back">
                    <i class="fas fa-arrow-left"></i>
                </a>
            </div>
            
            <div class="header-center">
                <input type="text" id="matchTitle" class="match-title-input" 
                       placeholder="Название матча">
            </div>
            
            <div class="header-right">
                <button id="deleteMatchBtn" class="btn btn-danger" title="Удалить матч">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </header>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- НОВОЕ ТАБЛО ЭНДОВ -->
            <div class="scoreboard-section">
                <div class="ends-table-container">
                    <table class="ends-table">
                        <thead>
                            <tr>
                                <th class="end-label">Энд</th>
                                <!-- 10 основных эндов -->
                                <th>1</th>
                                <th>2</th>
                                <th>3</th>
                                <th>4</th>
                                <th>5</th>
                                <th>6</th>
                                <th>7</th>
                                <th>8</th>
                                <th>9</th>
                                <th>10</th>
                                <!-- 2 экстра энда -->
                                <th class="extra-end">EE1</th>
                                <th class="extra-end">EE2</th>
                                <!-- Общий счет -->
                                <th class="total-column">TOTAL</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Команда 1 -->
                            <tr class="team-row team1-row">
                                <td class="team-name-cell">
                                    <input type="text" class="team-name-input team1-name" 
                                           id="team1NameInput" value="Команда 1">
                                </td>
                                <!-- Очки команды 1 по эндам -->
                                <td><input type="number" class="end-score team1-score" data-end="1" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team1-score" data-end="2" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team1-score" data-end="3" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team1-score" data-end="4" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team1-score" data-end="5" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team1-score" data-end="6" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team1-score" data-end="7" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team1-score" data-end="8" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team1-score" data-end="9" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team1-score" data-end="10" min="0" max="8" value="0"></td>
                                <!-- Экстра энды -->
                                <td><input type="number" class="end-score team1-score extra-end" data-end="11" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team1-score extra-end" data-end="12" min="0" max="8" value="0"></td>
                                <!-- Общий счет (автоматический) -->
                                <td class="total-cell" id="team1Total">0</td>
                            </tr>
                            
                            <!-- Команда 2 -->
                            <tr class="team-row team2-row">
                                <td class="team-name-cell">
                                    <input type="text" class="team-name-input team2-name" 
                                           id="team2NameInput" value="Команда 2">
                                </td>
                                <!-- Очки команды 2 по эндам -->
                                <td><input type="number" class="end-score team2-score" data-end="1" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team2-score" data-end="2" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team2-score" data-end="3" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team2-score" data-end="4" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team2-score" data-end="5" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team2-score" data-end="6" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team2-score" data-end="7" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team2-score" data-end="8" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team2-score" data-end="9" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team2-score" data-end="10" min="0" max="8" value="0"></td>
                                <!-- Экстра энды -->
                                <td><input type="number" class="end-score team2-score extra-end" data-end="11" min="0" max="8" value="0"></td>
                                <td><input type="number" class="end-score team2-score extra-end" data-end="12" min="0" max="8" value="0"></td>
                                <!-- Общий счет (автоматический) -->
                                <td class="total-cell" id="team2Total">0</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Управление эндами -->
                <div class="current-end-info">
                    <div class="current-end-display">
                        <span>Текущий энд:</span>
                        <select id="currentEndSelect" class="end-select">
                            <option value="1">Энд 1</option>
                            <option value="2">Энд 2</option>
                            <option value="3">Энд 3</option>
                            <option value="4">Энд 4</option>
                            <option value="5">Энд 5</option>
                            <option value="6">Энд 6</option>
                            <option value="7">Энд 7</option>
                            <option value="8">Энд 8</option>
                            <option value="9">Энд 9</option>
                            <option value="10">Энд 10</option>
                            <option value="11">Экстра Энд 1</option>
                            <option value="12">Экстра Энд 2</option>
                        </select>
                    </div>
                    
                    <div class="ends-controls">
                        <button id="prevEndBtn" class="btn btn-secondary">
                            <i class="fas fa-chevron-left"></i> Предыдущий
                        </button>
                        <button id="nextEndBtn" class="btn btn-secondary">
                            Следующий <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Таблица статистики команды 1 -->
            <div class="stats-section">
                <div class="team-stats-header">
                    <h3><i class="fas fa-users"></i> <span id="team1StatsTitle">Команда 1</span></h3>
                    <div class="team-color-indicator color-red"></div>
                </div>
                
                <div class="stats-table-container">
                    <table class="stats-table" id="team1Table">
                        <thead>
                            <tr>
                                <th class="throw-type">Вид броска</th>
                                <!-- Игроки будут добавляться динамически -->
                                <th class="team-total">Команда</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Данные будут добавляться динамически -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Таблица статистики команды 2 -->
            <div class="stats-section">
                <div class="team-stats-header">
                    <h3><i class="fas fa-users"></i> <span id="team2StatsTitle">Команда 2</span></h3>
                    <div class="team-color-indicator color-yellow"></div>
                </div>
                
                <div class="stats-table-container">
                    <table class="stats-table" id="team2Table">
                        <thead>
                            <tr>
                                <th class="throw-type">Вид броска</th>
                                <!-- Игроки будут добавляться динамически -->
                                <th class="team-total">Команда</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Данные будут добавляться динамически -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Кнопка ИГРАТЬ -->
            <div class="play-button-section">
                <a href="throw.html" id="playButton" class="btn btn-play">
                    <i class="fas fa-play-circle"></i> ИГРАТЬ
                </a>
            </div>
        </main>

        <!-- Футер -->
        <footer class="footer">
            <div class="match-info">
                <span id="lastSaved">Данные сохранены локально</span>
            </div>
        </footer>
    </div>

    <!-- Модальное окно подтверждения удаления -->
    <div id="deleteConfirmModal" class="modal hidden">
        <div class="modal-content confirm-modal">
            <h2><i class="fas fa-exclamation-triangle"></i> Удалить матч?</h2>
            <p>Все данные этого матча будут удалены без возможности восстановления.</p>
            <div class="modal-buttons">
                <button id="cancelDeleteBtn" class="btn btn-secondary">
                    Отмена
                </button>
                <button id="confirmDeleteBtn" class="btn btn-danger">
                    <i class="fas fa-trash"></i> Удалить
                </button>
            </div>
        </div>
    </div>

    <!-- Скрипты -->
    <script src="db.js"></script>
    <script src="match.js"></script>
    
    <script>
        // Получение ID матча из URL
        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('id');
        
        if (matchId) {
            window.matchId = matchId;
        } else {
            // Если нет ID, возвращаемся на главную
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
