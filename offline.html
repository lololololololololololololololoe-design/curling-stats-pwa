<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Офлайн - Статистика Керлинга</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        
        .offline-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            text-align: center;
        }
        
        .offline-icon {
            font-size: 80px;
            color: #f39c12;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        p {
            color: #7f8c8d;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <i class="fas fa-wifi-slash"></i>
        </div>
        
        <h1>Нет подключения к интернету</h1>
        
        <p>Приложение "Статистика Керлинга" работает в офлайн-режиме. Вы можете продолжать вести статистику, а данные синхронизируются при восстановлении соединения.</p>
        
        <button class="btn" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i> Вернуться назад
        </button>
    </div>
    
    <script>
        // Проверка подключения
        window.addEventListener('online', () => {
            window.location.href = '/index.html';
        });
        
        // Периодическая проверка
        setInterval(() => {
            if (navigator.onLine) {
                window.location.href = '/index.html';
            }
        }, 5000);
    </script>
</body>
</html>
